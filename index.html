<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Lora:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2A5.2 5.2 0 0 1 12 6.6a5.2 5.2 0 0 1 9.3 4.7c-1.8 4.6-9.3 9.2-9.3 9.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="sprig" viewBox="0 0 100 200">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 198C50 140 56 80 70 8"/>
        <path d="M50 150C30 140 20 120 24 100 42 108 52 130 50 150z"/>
        <path d="M52 124C74 116 88 98 86 78 66 84 54 104 52 124z"/>
        <path d="M58 86C42 76 36 58 40 42 54 50 62 66 58 86z"/>
        <path d="M65 54C81 46 87 30 83 16 71 22 65 38 65 54z"/>
        <path d="M50 150C42 132 34 116 24 100M52 124c10-12 22-30 34-46M58 86C52 70 46 56 40 42"/>
      </g>
    </symbol>
  </svg>

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><use href="#sprig" x="8" y="0" width="30" height="48"/></svg>
      <span>To Do List</span>
    </div>
    <p class="tagline">Small steps every day<br>lead to big results
      <svg width="22" height="22"><use href="#heart"/></svg>
    </p>
  </header>

  <div class="shell">
    <aside class="side">
      <nav>
        <button class="nav active" data-view="today">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Today
        </button>
        <button class="nav" id="nav-cal">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar
        </button>
        <button class="nav" data-view="all">
          <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>All Tasks
        </button>
        <button class="nav" id="nav-settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings
        </button>
      </nav>
      <div class="side-quote">
        <svg width="64" height="120" aria-hidden="true"><use href="#sprig"/></svg>
        <p>Good things<br>take time</p>
        <svg width="18" height="18"><use href="#heart"/></svg>
      </div>
    </aside>

    <main class="main">
      <h2 id="greeting">Good morning!</h2>
      <p id="sub" class="sub"></p>

      <form id="todo-form" class="add">
        <span class="plus" aria-hidden="true">+</span>
        <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" aria-label="New task">
        <input type="date" id="date-input" aria-label="Date">
        <input type="time" id="time-input" aria-label="Time">
        <button type="submit" id="add-btn">Add</button>
      </form>

      <div id="todo-list"></div>
    </main>

    <section class="right">
      <div class="cal card" id="calendar">
        <div class="cal-head">
          <h3 id="cal-title"></h3>
          <div>
            <button id="prev" aria-label="Previous month">‹</button>
            <button id="next" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="cal-grid cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="deco" aria-hidden="true">
        <svg class="deco-plant" width="150" height="300"><use href="#sprig"/></svg>
        <p>Better days<br>ahead</p>
        <svg class="deco-heart" width="26" height="26"><use href="#heart"/></svg>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
